name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worksphere
          POSTGRES_USER: worksphere
          POSTGRES_PASSWORD: worksphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksphere -d worksphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://worksphere:worksphere@localhost:5432/worksphere?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npm run migrate:deploy -w @worksphere/database
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run Playwright E2E tests
        run: npm run test:e2e -w @worksphere/web
        env:
          CI: true
      - name: Audit Node dependencies for vulnerabilities
        run: npm audit
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r apps/analytics/requirements.txt
      - run: pytest apps/analytics/tests
      - name: Audit Python dependencies for vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r apps/analytics/requirements.txt
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet
      - name: Build Web Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: worksphere/web:test
      - name: Build API Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: worksphere/api:test
      - name: Build Analytics Container
        uses: docker/build-push-action@v6
        with:
          context: apps/analytics
          file: apps/analytics/Dockerfile
          push: false
          tags: worksphere/analytics:test

