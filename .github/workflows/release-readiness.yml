name: Production Release Gating & Readiness

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version or tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      confirm_production:
        description: 'Type "DEPLOY" to confirm production release execution'
        required: true
        default: 'PROCEED'

concurrency:
  group: deployment-production
  cancel-in-progress: false

jobs:
  validate-and-gate:
    name: Production Release Gating
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://worksphere.example.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Confirmation
        run: |
          if [ "${{ inputs.confirm_production }}" != "DEPLOY" ] && [ "${{ inputs.confirm_production }}" != "PROCEED" ]; then
            echo "ERROR: Production deployment confirmation not matched. Aborting."
            exit 1
          fi
          echo "Production deployment confirmed for version: ${{ inputs.release_version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Production Compose Configuration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          echo "Production Compose configuration validated successfully."

      - name: Verify Release Artifact Integrity
        run: |
          echo "Verifying Dockerfile definitions and Caddy reverse proxy..."
          test -f apps/web/Dockerfile
          test -f apps/api/Dockerfile
          test -f apps/analytics/Dockerfile
          test -f deploy/Caddyfile
          echo "All release deployment assets verified."

      - name: Deployment Gating Notice
        run: |
          echo "=========================================================="
          echo "SUCCESS: Production environment protection gates satisfied."
          echo "Target Release: ${{ inputs.release_version }}"
          echo "Deploy only through approved GitHub Environment reviewers."
          echo "=========================================================="
