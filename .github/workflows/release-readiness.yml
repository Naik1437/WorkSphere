name: Release readiness
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment name; deployment remains externally approved.
        required: true
        default: staging
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - run: echo "Validated deployment configuration for ${{ inputs.environment }}. Deploy only through the approved infrastructure workflow."
